<style>

  --brand-bg-deeper: color-mix(in oklab, #800020 88%, black);
  --brand-muted: color-mix(in oklab, #800020 76%, #fff9f2);
  --brand-accent: #D45060;
  /* Darkened accent for fills that sit under text (≥4.5:1 with Off-White). */
  --brand-accent-deep: color-mix(in oklab, #D45060 72%, #800020);
  --brand-surface: #fff9f2;
  --brand-surface-alt: #f3e6d5;
  --brand-highlight: #f3e6d5;
  --brand-on-dark: #fff9f2;
  --brand-on-light: #800020;
  --brand-error: #B3261E;
}
.parts-serviceArtwork {
  --art-ink: #800020;
  --art-card: #fff9f2;
  --art-card-alt: #f3e6d5;
  --art-accent: #bc3d4d;
  --art-sage: #c9d3c0;
  --art-olive: #5a6432;
  --art-mini-bg: #fff9f2;
  --art-mini-fg: #800020;
  --art-mini-stroke: rgba(128, 0, 32, 0.22);
}
.parts-serviceArtwork[data-surface='beige-plate'] {
  background-color: var(--brand-surface-alt, #f3e6d5);
}
.parts-serviceArtwork[data-surface='sage-plate'] {
  background-color: var(--brand-sage, #c9d3c0);
  --art-ink: #2a0208;
  --art-card: #fff9f2;
  --art-card-alt: #f3e6d5;
}
.parts-serviceArtwork--plate {
  position: relative;
  width: 100%;
  height: 100%;
}
.parts-serviceArtwork--mini {
  width: 96px;
  height: 96px;
  flex: 0 0 auto;
}
@media (min-width: 1440px) {
  .parts-serviceArtwork--mini {
    width: 112px;
    height: 112px;
  }
}
.parts-serviceArtwork[data-surface='beige'],
.parts-serviceArtwork[data-surface='beige-alt'] {
  --art-mini-bg: #fff9f2;
  --art-mini-fg: #2a0208;
  --art-mini-stroke: rgba(128, 0, 32, 0.22);
}
.parts-serviceArtwork[data-surface='burgundy'],
.parts-serviceArtwork[data-surface='deepest'] {
  --art-mini-bg: #fff9f2;
  --art-mini-fg: #800020;
  --art-mini-stroke: rgba(255, 249, 242, 0.4);
}
.parts-serviceArtwork[data-surface='sage'] {
  --art-mini-bg: #fff9f2;
  --art-mini-fg: #2f3a1e;
  --art-mini-stroke: rgba(47, 58, 30, 0.35);
}
.parts-serviceArtwork[data-surface='brick'] {
  --art-mini-bg: #5a0014;
  --art-mini-fg: #fff9f2;
  --art-mini-stroke: rgba(255, 249, 242, 0.35);
}
@media (prefers-reduced-motion: no-preference) {
  .parts-serviceArtwork__brick {
    transition: transform var(--dur-std) var(--ease-brand);
  }
  .parts-serviceCard:hover .parts-serviceArtwork__brick,
  .parts-serviceBlock:hover .parts-serviceArtwork__brick {
    transform: translateY(-3px);
  }
}

  body { margin:0; padding:20px; background:#F3E6D5; color:#800020; font-family:sans-serif; }
  .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); max-width:1400px; margin:0 auto; }
