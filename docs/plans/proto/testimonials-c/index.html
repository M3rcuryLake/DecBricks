<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto C — Split sticky + stack</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../../../../public/fonts/bricolage-grotesque-latin.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../../../../public/fonts/hanken-grotesk-latin.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Departure Mono';src:url('../../../../public/fonts/departure-mono-regular.woff2') format('woff2');font-display:swap}
@font-face{font-family:'FK Raster';src:url('../../../../public/fonts/fk-raster-roman-compact.woff2') format('woff2');font-display:swap}
:root{--burgundy:#800020;--beige:#F3E6D5;--offwhite:#FFF9F2;--coral:#D45060;--sage:#C9D3C0;--olive:#5A6432;--ink:#2A0208}
*{margin:0;box-sizing:border-box}
body{background:var(--offwhite);font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.t-band{background:var(--burgundy);border-radius:20px 20px 0 0;padding:clamp(48px,6vw,96px) clamp(20px,3.5vw,64px)}
.t-split{display:grid;grid-template-columns:minmax(280px,4fr) 7fr;gap:clamp(32px,4vw,80px);align-items:start}
@media (max-width:900px){.t-split{grid-template-columns:1fr}}
.t-left{position:sticky;top:32px}
.t-kicker{font-family:'Departure Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--beige)}
.t-kicker em{font-style:normal;color:var(--coral)}
.t-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:var(--offwhite);font-size:clamp(34px,4vw,60px);line-height:1.02;margin:12px 0 18px;max-width:14ch}
.t-lede{color:var(--beige);font-size:16px;line-height:1.55;max-width:36ch;opacity:.92}
.t-cta{display:inline-block;margin-top:28px;padding:16px 28px;border-radius:999px;border:1px solid var(--beige);color:var(--beige);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;text-decoration:none}
.t-cta:hover{background:var(--offwhite);color:var(--burgundy)}
.t-cta:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.t-stack{display:flex;flex-direction:column;gap:clamp(18px,2vw,28px)}
.t-card{background:var(--offwhite);border-radius:14px;border-left:6px solid var(--coral);padding:clamp(24px,2.6vw,40px);transform:translateY(24px);opacity:0;transition:transform .5s cubic-bezier(.22,.8,.36,1),opacity .5s ease}
.t-card.in{transform:none;opacity:1}
.t-card:nth-child(3n+2){background:var(--beige);border-left-color:var(--olive)}
.t-card:nth-child(3n){background:var(--sage);border-left-color:var(--burgundy)}
.t-quote{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;color:var(--burgundy);font-size:clamp(20px,2vw,30px);line-height:1.22;text-wrap:balance}
.t-foot{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.t-ava{width:40px;height:40px;border-radius:50%;background:var(--burgundy);color:var(--beige);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;display:grid;place-items:center;font-size:14px;flex:none}
.t-who b{display:block;color:var(--burgundy);font-size:14px;font-weight:700}
.t-who span{font-size:13px;opacity:.72}
.t-chip{margin-left:auto;font-family:'Departure Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--olive);border:1px solid var(--olive);border-radius:999px;padding:5px 10px;white-space:nowrap}
.t-meta{margin-top:clamp(28px,3vw,44px);font-family:'Departure Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--beige);opacity:.8}
</style></head>
<body>
<section class="t-band" aria-labelledby="t-title">
  <div class="t-split">
    <div class="t-left">
      <p class="t-kicker">04 <em>///</em> Social proof</p>
      <h2 class="t-title" id="t-title">Built on trust, quote by quote</h2>
      <p class="t-lede">Placeholder set shown while client approvals are in progress. Real quotes, names and written consent land here before launch.</p>
      <a class="t-cta" href="#">Start a project</a>
    </div>
    <div class="t-stack" id="t-stack"></div>
  </div>
  <p class="t-meta">08 quotes /// placeholder set /// Decbricks</p>
</section>
<script>
const T=[
 {quote:'It felt like having another strategist on our side — not just another agency.',name:'Client Name',role:'Founder',company:'Studio Name',service:'Strategy',initials:'CN'},
 {quote:'We worked as one force from first sketch to final cut — and the recognition followed.',name:'Client Name',role:'Creative Director',company:'Brand Name',service:'Creative',initials:'CN'},
 {quote:'We found the perfect partner. Highly recommended.',name:'Client Name',role:'Producer',company:'Company Name',service:'Web Development',initials:'CN'},
 {quote:'A tremendous thank-you to the entire team — your dedication and collaboration have been invaluable from day one.',name:'Client Name',role:'Product Lead',company:'Company Name',service:'Web Development',initials:'CN'},
 {quote:'Their expertise lifted our engagement to new heights. Always pushing the boundaries, with the flexibility and creativity you hope for in a partner.',name:'Client Name',role:'Head of Growth',company:'Company Name',service:'Strategy',initials:'CN'},
 {quote:'From the collaborative design process to the meticulous execution of our vision, they have been a joy to work with.',name:'Client Name',role:'Studio Head',company:'Company Name',service:'Creative',initials:'CN'},
 {quote:'They exemplify professionalism and offer invaluable insights. Their execution was impeccable.',name:'Client Name',role:'Marketing Manager',company:'Company Name',service:'Campaigns',initials:'CN'},
 {quote:'Exceptional work across the board — campaigns drove a real revenue uplift and supported rapid audience growth ahead of our launch.',name:'Client Name',role:'Publishing Director',company:'Company Name',service:'Campaigns',initials:'CN'},
];
const stack=document.getElementById('t-stack');
T.forEach((t,i)=>{
  const el=document.createElement('article');el.className='t-card';el.id='t-'+(i+1);
  el.innerHTML='<blockquote class="t-quote">'+t.quote+'</blockquote><div class="t-foot"><span class="t-ava" aria-hidden="true">'+t.initials+'</span><div class="t-who"><b>'+t.name+'</b><span>'+t.role+', '+t.company+'</span></div><span class="t-chip">'+t.service+'</span></div>';
  stack.appendChild(el);
});
const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.1});
stack.querySelectorAll('.t-card').forEach((el,i)=>{el.style.transitionDelay=(i%4)*70+'ms';io.observe(el)});
</script>
</body></html>
