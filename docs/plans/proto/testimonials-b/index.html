<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto B — Brick wall</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../../../../public/fonts/bricolage-grotesque-latin.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../../../../public/fonts/hanken-grotesk-latin.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Departure Mono';src:url('../../../../public/fonts/departure-mono-regular.woff2') format('woff2');font-display:swap}
@font-face{font-family:'FK Raster';src:url('../../../../public/fonts/fk-raster-roman-compact.woff2') format('woff2');font-display:swap}
:root{--burgundy:#800020;--beige:#F3E6D5;--offwhite:#FFF9F2;--coral:#D45060;--sage:#C9D3C0;--olive:#5A6432;--ink:#2A0208}
*{margin:0;box-sizing:border-box}
body{background:var(--offwhite);font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.t-band{background:var(--burgundy);border-radius:20px 20px 0 0;padding:clamp(48px,6vw,96px) clamp(20px,3.5vw,64px)}
.t-head{display:flex;align-items:end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,40px)}
.t-kicker{font-family:'Departure Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--beige)}
.t-kicker em{font-style:normal;color:var(--coral)}
.t-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:var(--offwhite);font-size:clamp(30px,3.6vw,52px);line-height:1.05;margin-top:10px;max-width:16ch}
.t-filters{display:flex;gap:8px;flex-wrap:wrap}
.t-filters button{all:unset;cursor:pointer;font-family:'Departure Mono',monospace;font-size:11px;text-transform:uppercase;padding:10px 16px;border-radius:999px;border:1px solid var(--beige);color:var(--beige)}
.t-filters button:hover{background:rgba(255,249,242,.1)}
.t-filters button.is-active{background:var(--olive);border-color:var(--olive);color:var(--offwhite)}
.t-filters button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.t-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.5vw,22px);counter-reset:brick}
@media (max-width:1024px){.t-wall{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.t-wall{grid-template-columns:1fr}}
.t-brick{border-radius:14px;padding:clamp(24px,2.4vw,36px);display:flex;flex-direction:column;gap:18px;min-height:200px;position:relative;transform:translateY(24px);opacity:0;transition:transform .5s cubic-bezier(.22,.8,.36,1),opacity .5s ease}
.t-brick.in{transform:none;opacity:1}
.t-brick:nth-child(3n+1){background:var(--offwhite)}
.t-brick:nth-child(3n+2){background:var(--beige)}
.t-brick:nth-child(3n){background:var(--sage)}
.t-brick.featured{grid-column:span 2;background:var(--offwhite)}
.t-num{font-family:'FK Raster',monospace;font-size:15px;color:var(--burgundy);opacity:.55}
.t-quote{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;color:var(--burgundy);font-size:clamp(19px,1.7vw,27px);line-height:1.25;text-wrap:balance}
.t-brick.featured .t-quote{font-size:clamp(24px,2.4vw,36px)}
.t-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid rgba(128,0,32,.14);flex-wrap:wrap}
.t-ava{width:40px;height:40px;border-radius:50%;background:var(--burgundy);color:var(--beige);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;display:grid;place-items:center;font-size:14px;flex:none}
.t-who b{display:block;color:var(--burgundy);font-size:14px;font-weight:700}
.t-who span{font-size:13px;opacity:.72}
.t-chip{margin-left:auto;font-family:'Departure Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--olive);border:1px solid var(--olive);border-radius:999px;padding:5px 10px;white-space:nowrap}
.t-meta{display:flex;justify-content:space-between;gap:16px;margin-top:clamp(24px,3vw,40px);font-family:'Departure Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--beige);opacity:.8}
.t-hidden{display:none!important}
</style></head>
<body>
<section class="t-band" aria-labelledby="t-title">
  <div class="t-head">
    <div>
      <p class="t-kicker">04 <em>///</em> Social proof</p>
      <h2 class="t-title" id="t-title">Laid brick by brick, project by project</h2>
    </div>
    <div class="t-filters" role="group" aria-label="Filter quotes by service" id="t-filters"></div>
  </div>
  <div class="t-wall" id="t-wall"></div>
  <div class="t-meta"><span>08 quotes /// placeholder set</span><span>Decbricks /// social proof</span></div>
</section>
<script>
const T=[
 {quote:'It felt like having another strategist on our side — not just another agency.',name:'Client Name',role:'Founder',company:'Studio Name',service:'Strategy',initials:'CN',featured:true},
 {quote:'We worked as one force from first sketch to final cut — and the recognition followed.',name:'Client Name',role:'Creative Director',company:'Brand Name',service:'Creative',initials:'CN'},
 {quote:'We found the perfect partner. Highly recommended.',name:'Client Name',role:'Producer',company:'Company Name',service:'Web Development',initials:'CN'},
 {quote:'A tremendous thank-you to the entire team — your dedication and collaboration have been invaluable from day one.',name:'Client Name',role:'Product Lead',company:'Company Name',service:'Web Development',initials:'CN'},
 {quote:'Their expertise lifted our engagement to new heights. Always pushing the boundaries, with the flexibility and creativity you hope for in a partner.',name:'Client Name',role:'Head of Growth',company:'Company Name',service:'Strategy',initials:'CN'},
 {quote:'From the collaborative design process to the meticulous execution of our vision, they have been a joy to work with.',name:'Client Name',role:'Studio Head',company:'Company Name',service:'Creative',initials:'CN'},
 {quote:'They exemplify professionalism and offer invaluable insights. Their execution was impeccable.',name:'Client Name',role:'Marketing Manager',company:'Company Name',service:'Campaigns',initials:'CN'},
 {quote:'Exceptional work across the board — campaigns drove a real revenue uplift and supported rapid audience growth ahead of our launch.',name:'Client Name',role:'Publishing Director',company:'Company Name',service:'Campaigns',initials:'CN'},
];
const wall=document.getElementById('t-wall'),filters=document.getElementById('t-filters');
T.forEach((t,i)=>{
  const el=document.createElement('article');el.className='t-brick'+(t.featured?' featured':'');el.dataset.svc=t.service;
  el.innerHTML='<span class="t-num" aria-hidden="true">0'+(i+1)+'</span><blockquote class="t-quote">'+t.quote+'</blockquote><div class="t-foot"><span class="t-ava" aria-hidden="true">'+t.initials+'</span><div class="t-who"><b>'+t.name+'</b><span>'+t.role+', '+t.company+'</span></div><span class="t-chip">'+t.service+'</span></div>';
  wall.appendChild(el);
});
const svcs=['All',...new Set(T.map(t=>t.service))];
svcs.forEach((s,i)=>{
  const b=document.createElement('button');b.type='button';b.textContent=s;if(i===0)b.classList.add('is-active');
  b.addEventListener('click',()=>{
    filters.querySelectorAll('button').forEach(x=>x.classList.remove('is-active'));b.classList.add('is-active');
    wall.querySelectorAll('.t-brick').forEach(br=>br.classList.toggle('t-hidden',s!=='All'&&br.dataset.svc!==s));
  });
  filters.appendChild(b);
});
const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});
wall.querySelectorAll('.t-brick').forEach((el,i)=>{el.style.transitionDelay=(i%6)*60+'ms';io.observe(el)});
</script>
</body></html>
