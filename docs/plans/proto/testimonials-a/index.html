<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto A — Editorial spotlight</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../../../../public/fonts/bricolage-grotesque-latin.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../../../../public/fonts/hanken-grotesk-latin.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Departure Mono';src:url('../../../../public/fonts/departure-mono-regular.woff2') format('woff2');font-display:swap}
@font-face{font-family:'FK Raster';src:url('../../../../public/fonts/fk-raster-roman-compact.woff2') format('woff2');font-display:swap}
:root{
  --burgundy:#800020; --beige:#F3E6D5; --offwhite:#FFF9F2; --coral:#D45060; --coral-deep:#BC3D4D;
  --sage:#C9D3C0; --olive:#5A6432; --ink:#2A0208;
}
*{margin:0;box-sizing:border-box}
body{background:var(--offwhite);font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.t-band{background:var(--burgundy);border-radius:20px 20px 0 0;padding:clamp(48px,6vw,96px) clamp(20px,3.5vw,64px)}
.t-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:clamp(32px,4vw,64px)}
.t-kicker{font-family:'Departure Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--beige)}
.t-kicker em{font-style:normal;color:var(--coral)}
.t-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:var(--offwhite);font-size:clamp(28px,3.2vw,44px);line-height:1.05;margin-top:10px}
.t-index{font-family:'FK Raster',monospace;font-size:clamp(40px,5vw,72px);line-height:1;color:var(--beige);white-space:nowrap}
.t-index b{color:var(--coral);font-weight:400}
.t-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(24px,3vw,56px);align-items:start}
@media (max-width:900px){.t-grid{grid-template-columns:1fr}}
.t-stage{position:relative;min-height:340px}
.t-quote-card{background:var(--offwhite);border-radius:16px;padding:clamp(28px,3vw,48px) clamp(24px,3vw,48px) clamp(24px,2.5vw,40px);position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease}
.t-quote-card.is-active{position:relative;opacity:1;pointer-events:auto;transform:none}
.t-qmark{font-family:'FK Raster',monospace;color:var(--coral);font-size:40px;line-height:.6;display:block;margin-bottom:18px}
.t-quote{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;color:var(--burgundy);font-size:clamp(24px,2.6vw,44px);line-height:1.15;text-wrap:balance}
.t-attr{display:flex;align-items:center;gap:14px;margin-top:clamp(20px,2.5vw,36px);flex-wrap:wrap}
.t-dot{width:44px;height:44px;border-radius:50%;background:var(--burgundy);color:var(--beige);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;display:grid;place-items:center;font-size:16px}
.t-who b{display:block;color:var(--burgundy);font-size:15px;font-weight:700}
.t-who span{color:var(--ink);opacity:.72;font-size:14px}
.t-chip{margin-left:auto;font-family:'Departure Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--olive);border:1px solid var(--olive);border-radius:999px;padding:6px 12px;white-space:nowrap}
.t-rail{display:flex;flex-direction:column;gap:6px}
.t-rail-title{font-family:'Departure Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--beige);opacity:.75;margin-bottom:8px}
.t-rail button{all:unset;display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;color:var(--beige)}
.t-rail button:hover{background:rgba(255,249,242,.08)}
.t-rail button.is-active{background:var(--offwhite);color:var(--burgundy)}
.t-rail .rq{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-rail .ra{font-family:'Departure Mono',monospace;font-size:10px;text-transform:uppercase;opacity:.75;margin-top:4px}
.t-controls{display:flex;align-items:center;gap:12px;margin-top:clamp(24px,3vw,40px)}
.t-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--beige);background:transparent;color:var(--beige);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.t-btn:hover{background:var(--offwhite);color:var(--burgundy)}
.t-btn:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.t-prog{flex:1;height:2px;background:rgba(243,230,213,.25);border-radius:2px;overflow:hidden}
.t-prog i{display:block;height:100%;background:var(--coral);width:12.5%;transition:width .3s ease}
.t-note{font-family:'Departure Mono',monospace;font-size:10px;color:var(--beige);opacity:.6}
</style></head>
<body>
<section class="t-band" aria-labelledby="t-title" aria-roledescription="carousel" role="region">
  <div class="t-head">
    <div>
      <p class="t-kicker">04 <em>///</em> Social proof</p>
      <h2 class="t-title" id="t-title">What our clients say</h2>
    </div>
    <p class="t-index" id="t-count"><b>01</b> / 08</p>
  </div>
  <div class="t-grid">
    <div class="t-stage" id="t-stage"></div>
    <nav class="t-rail" aria-label="Jump to a quote">
      <p class="t-rail-title">All quotes</p>
      <div id="t-rail-list"></div>
    </nav>
  </div>
  <div class="t-controls">
    <button class="t-btn" id="t-prev" aria-label="Previous quote"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="t-btn" id="t-next" aria-label="Next quote"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <div class="t-prog" aria-hidden="true"><i id="t-bar"></i></div>
    <span class="t-note">Arrow keys work too</span>
  </div>
</section>
<script>
const T=[
 {id:'t-1',quote:'It felt like having another strategist on our side — not just another agency.',name:'Client Name',role:'Founder',company:'Studio Name',service:'Strategy',initials:'CN'},
 {id:'t-2',quote:'We worked as one force from first sketch to final cut — and the recognition followed.',name:'Client Name',role:'Creative Director',company:'Brand Name',service:'Creative',initials:'CN'},
 {id:'t-3',quote:'We found the perfect partner. Highly recommended.',name:'Client Name',role:'Producer',company:'Company Name',service:'Web Development',initials:'CN'},
 {id:'t-4',quote:'A tremendous thank-you to the entire team — your dedication and collaboration have been invaluable from day one.',name:'Client Name',role:'Product Lead',company:'Company Name',service:'Web Development',initials:'CN'},
 {id:'t-5',quote:'Their expertise lifted our engagement to new heights. Always pushing the boundaries, with the flexibility and creativity you hope for in a partner.',name:'Client Name',role:'Head of Growth',company:'Company Name',service:'Strategy',initials:'CN'},
 {id:'t-6',quote:'From the collaborative design process to the meticulous execution of our vision, they have been a joy to work with.',name:'Client Name',role:'Studio Head',company:'Company Name',service:'Creative',initials:'CN'},
 {id:'t-7',quote:'They exemplify professionalism and offer invaluable insights. Their execution was impeccable.',name:'Client Name',role:'Marketing Manager',company:'Company Name',service:'Campaigns',initials:'CN'},
 {id:'t-8',quote:'Exceptional work across the board — campaigns drove a real revenue uplift and supported rapid audience growth ahead of our launch.',name:'Client Name',role:'Publishing Director',company:'Company Name',service:'Campaigns',initials:'CN'},
];
const stage=document.getElementById('t-stage'),rail=document.getElementById('t-rail-list');
let cur=0;
const cards=T.map((t,i)=>{
  const el=document.createElement('article');
  el.className='t-quote-card';el.id=t.id;el.setAttribute('aria-roledescription','quote');
  el.setAttribute('aria-label',(i+1)+' of '+T.length);
  el.innerHTML='<span class="t-qmark" aria-hidden="true">///</span><blockquote class="t-quote">'+t.quote+'</blockquote><div class="t-attr"><span class="t-dot" aria-hidden="true">'+t.initials+'</span><div class="t-who"><b>'+t.name+'</b><span>'+t.role+', '+t.company+'</span></div><span class="t-chip">'+t.service+'</span></div>';
  stage.appendChild(el);
  const b=document.createElement('button');b.type='button';b.innerHTML='<span class="rq">'+t.quote+'</span><span class="ra">'+(i+1)+' · '+t.service+'</span>';
  b.setAttribute('aria-controls',t.id);
  b.addEventListener('click',()=>go(i));
  rail.appendChild(b);
  return {el,b};
});
function go(n){cur=(n+T.length)%T.length;
  cards.forEach((c,i)=>{const on=i===cur;c.el.classList.toggle('is-active',on);c.b.classList.toggle('is-active',on);
    c.el.setAttribute('aria-hidden',on?'false':'true');c.b.setAttribute('aria-current',on?'true':'false');});
  document.getElementById('t-count').innerHTML='<b>0'+(cur+1)+'</b> / 0'+T.length;
  document.getElementById('t-bar').style.width=((cur+1)/T.length*100)+'%';
}
go(0);
document.getElementById('t-prev').addEventListener('click',()=>go(cur-1));
document.getElementById('t-next').addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',(e)=>{
  const r=document.querySelector('.t-band').contains(document.activeElement);
  if(!r)return;
  if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();}
  if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}
});
// hide inactive cards from tab order
</script>
</body></html>
